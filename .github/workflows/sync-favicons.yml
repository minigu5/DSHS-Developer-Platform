name: Sync favicons

# "URL에서 자동 추출" 아이콘을 쓰는 프로젝트의 아이콘을 매일 밤 사이트의 지금 파비콘으로 맞춘다.
# 스크립트: scripts/sync-favicons.mts / 판단 로직: src/lib/favicon-sync.ts

on:
  schedule:
    # 매일 03:15 KST (UTC 18:15). README 동기화(03:00)와 도메인 점검(03:30) 사이. GitHub 부하에 따라 늦을 수 있다.
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DB를 바꾸지 않고 바뀔 내용만 로그로 확인'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-favicons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 스크립트는 @supabase/supabase-js 만 필요해서 postinstall(가이드 조각 묶기)은 건너뛴다
      - run: npm ci --ignore-scripts

      - name: Sync favicons
        run: node scripts/sync-favicons.mts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
