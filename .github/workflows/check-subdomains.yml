name: Check subdomains

# 주소 받기(<이름>.dshs.dev): 매일 밤 소유 확인 토큰을 확인하고, 7일 넘게 끊긴·연결 안 된 주소를 반납하고,
# 반납·회수된 주소의 Cloudflare 레코드를 지운다(주인이 떠난 주소를 남이 가로채지 못하게).
# 스크립트: scripts/check-subdomains.mts / 설정: supabase/migrations/20261025100000_subdomains.sql

on:
  schedule:
    # 매일 03:30 KST (UTC 18:30). README 동기화(03:00) 다음. GitHub 부하에 따라 늦을 수 있다.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DB·DNS 를 바꾸지 않고 결과만 로그로 확인'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-subdomains
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 스크립트는 @supabase/supabase-js 만 필요해서 postinstall(가이드 조각 묶기)은 건너뛴다
      - run: npm ci --ignore-scripts

      - name: Check subdomains
        run: node scripts/check-subdomains.mts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
