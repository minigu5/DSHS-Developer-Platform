# /etc/systemd/system/dshs.service.d/zzzz-harden.conf (2026-11-12 보안 점검)
# 이 서버(LXC)는 /run/systemd/system/service.d/zzz-lxc-service.conf 가 모든 서비스의 ProtectProc·NoNewPrivileges 등을 꺼 버린다.
# 그러면 앱이 /proc 에서 다른 계정 프로세스의 명령줄(플랫폼 웹 터미널 비밀번호 포함)을 읽을 수 있었다.
# drop-in 은 파일 이름 순으로 적용되므로 zzz-lxc 보다 뒤인 이 이름으로 다시 켠다.
[Service]
ProtectProc=invisible
NoNewPrivileges=yes
